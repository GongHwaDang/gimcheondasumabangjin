<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👀 관전 전용 — 김천다수 마방진 대회</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MQTT WebSocket: 선수 화면과 동일한 4자리 방 번호 채널을 "읽기 전용"으로 구독 -->
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: #F4F5F7;
      color: #22252A;
      overflow-x: hidden;
    }
    /* 선수 화면과 동일한 보드판 디자인 (복제) */
    .wood-board {
      background: linear-gradient(145deg, #fbf8f3 0%, #f0e5d3 58%, #e4d4bc 100%);
      box-shadow: 0 16px 32px rgba(45, 32, 18, 0.14), 0 6px 0 #c6b091, inset 0 2px 4px rgba(255, 255, 255, 0.85);
      border: 3px solid #d4bea0;
    }
    .board-slot-printed {
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f4ece0 72%, #e2d3bc 100%);
      box-shadow: inset 0 3px 6px rgba(60, 40, 15, 0.25), 0 1px 2px rgba(255, 255, 255, 0.95);
      border: 3px solid #292524;
    }
    .yellow-chip {
      background: radial-gradient(circle at 30% 28%, #fef9c3 0%, #facc15 48%, #eab308 88%, #ca8a04 100%);
      box-shadow: 0 4px 0 #a16207, 0 7px 12px rgba(0, 0, 0, 0.28), inset 0 2px 3px rgba(255, 255, 255, 0.9);
      border: 2.5px solid #b45309;
    }
    .num-underline {
      text-decoration: underline;
      text-decoration-thickness: 2.5px;
      text-underline-offset: 2px;
    }
    .line-badge {
      white-space: nowrap !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      line-height: 1;
      padding: 4px 10px;
      border-radius: 9999px;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
    }
    /* 경기 재현 애니메이션 */
    .chip-place-drop { animation: chipPlaceDrop 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes chipPlaceDrop {
      0%   { transform: translate(-50%, -50%) scale(0.25) translateY(-34px); opacity: 0.2; }
      60%  { transform: translate(-50%, -50%) scale(1.18) translateY(2px); opacity: 1; }
      82%  { transform: translate(-50%, -50%) scale(0.95) translateY(0); }
      100% { transform: translate(-50%, -50%) scale(1) translateY(0); }
    }
    .chip-flip-3d { animation: chipFlip3D 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes chipFlip3D {
      0%   { transform: translate(-50%, -50%) perspective(400px) rotateY(0deg) scale(1); }
      45%  { transform: translate(-50%, -50%) perspective(400px) rotateY(90deg) scale(1.32); filter: brightness(1.25); }
      55%  { transform: translate(-50%, -50%) perspective(400px) rotateY(90deg) scale(1.32); }
      100% { transform: translate(-50%, -50%) perspective(400px) rotateY(0deg) scale(1); filter: brightness(1); }
    }
    .slot-ripple-ring {
      position: absolute;
      inset: -6px;
      border-radius: 9999px;
      border: 3px solid #4f46e5;
      pointer-events: none;
      animation: slotRipple 0.65s ease-out forwards;
    }
    .slot-ripple-flip { border-color: #f59e0b; }
    @keyframes slotRipple {
      0%   { transform: scale(0.85); opacity: 0.95; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .bingo-chip-celebrate { animation: bingoChipCelebrate 0.9s ease-in-out infinite alternate; }
    @keyframes bingoChipCelebrate {
      0%   { transform: translate(-50%, -50%) scale(1) translateY(0); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      100% { transform: translate(-50%, -50%) scale(1.13) translateY(-5px); box-shadow: 0 0 18px 5px rgba(245, 158, 11, 0.75); }
    }
    /* 주사위 */
    .dice-box {
      width: 52px; height: 52px;
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      border: 2.5px solid #1e293b;
      border-radius: 15px;
      box-shadow: 0 5px 0 #cbd5e1, 0 8px 14px rgba(15, 23, 42, 0.14);
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      place-items: center;
      flex-shrink: 0;
    }
    .dice-pip {
      width: 10px; height: 10px;
      border-radius: 9999px;
      background-color: #0f172a;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
    }
    .dice-pip-one { width: 14px; height: 14px; background-color: #dc2626; }
    .input-error-shake {
      animation: errorShake 0.4s ease-in-out;
      border-color: #e11d48 !important;
      background-color: #fff1f2 !important;
    }
    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }
  </style>
</head>
<body class="h-[100dvh] max-h-[100dvh] w-screen overflow-hidden flex flex-col items-center justify-center p-2 sm:p-3">

  <div id="spectatorApp" class="w-full max-w-4xl h-full max-h-full bg-white rounded-3xl shadow-xl border border-slate-200/90 p-2.5 sm:p-4 flex flex-col gap-1.5 sm:gap-2 overflow-hidden">

    <!-- 1. 상단 헤더: 제목 + 방 번호 입력 + 연결 상태 -->
    <div class="shrink-0 flex flex-col gap-1.5 border-b border-slate-200 pb-2">
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
            <span class="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-[#22252A] text-white whitespace-nowrap">👀 관전자 전용 화면</span>
            <span id="connStatusPill" class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-500 border border-slate-300 whitespace-nowrap">
              ⚪ 연결 대기 중
            </span>
            <span id="specRoomBadge" class="hidden text-[11px] font-black px-2.5 py-0.5 rounded-full bg-[#E6F0FF] text-[#1473E6] border border-[#B3D4FF] whitespace-nowrap">
              방 번호: ----
            </span>
          </div>
          <h1 class="text-base sm:text-xl font-black text-[#22252A] tracking-tight leading-tight whitespace-nowrap">
            ⭐ 김천다수 마방진 <span class="text-slate-500 text-xs sm:text-sm font-extrabold">(합 26 빙고 대전 · 관전)</span>
          </h1>
        </div>
        <button id="btnLeaveSpec" type="button" class="hidden shrink-0 whitespace-nowrap text-xs font-extrabold px-3 py-1.5 rounded-xl bg-[#F4F5F7] hover:bg-slate-200 text-[#22252A] border border-slate-300 transition cursor-pointer">
          🚪 관전 나가기
        </button>
      </div>

      <!-- 방 번호 입장 바 (관전 시작 전에만 표시) -->
      <div id="joinBar" class="flex flex-col sm:flex-row sm:items-center gap-2 bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2">
        <span class="text-xs font-extrabold text-slate-700 whitespace-nowrap">🔢 선수 화면 상단에 표시된 <span class="text-[#1473E6]">4자리 방 번호</span>를 입력하세요 (온라인 1:1 경기)</span>
        <div class="flex items-center gap-2 sm:ml-auto">
          <input id="inpSpecCode" type="text" inputmode="numeric" maxlength="4" placeholder="예: 1234" class="w-28 px-3 py-2 rounded-xl bg-white border-2 border-slate-300 focus:border-[#1473E6] font-black text-center text-lg tracking-widest text-slate-900 outline-none transition" />
          <button id="btnJoinSpec" type="button" class="px-4 py-2 rounded-xl bg-[#1473E6] hover:bg-[#0D66D0] text-white font-black text-sm shadow-sm transition cursor-pointer whitespace-nowrap">
            👀 관전 입장
          </button>
        </div>
      </div>
    </div>

    <!-- 2. 점수판: 이름 + 칩 개수 + 남은 시간 -->
    <div id="scoreBar" class="shrink-0 flex items-center justify-between gap-2 bg-slate-50 px-3 py-1.5 rounded-2xl border border-slate-200/80">
      <div id="badgeRed" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-xl border-2 border-transparent bg-slate-100 font-bold text-xs text-slate-500 transition whitespace-nowrap">
        <span id="labelRed">🔴 빨강 플레이어</span>
        <span id="countRedChips" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 font-black text-xs">0개</span>
        <span id="clockRed" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 font-black text-xs tabular-nums">⏱ 5:00</span>
      </div>

      <span class="text-xs font-extrabold text-slate-500 whitespace-nowrap">VS</span>

      <div id="badgeBlue" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-xl border-2 border-transparent bg-slate-100 font-bold text-xs text-slate-500 transition whitespace-nowrap">
        <span id="clockBlue" class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 font-black text-xs tabular-nums">⏱ 5:00</span>
        <span id="countBlueChips" class="px-2 py-0.5 rounded-full bg-white text-slate-700 font-black text-xs">0개</span>
        <span id="labelBlue">🔵 파랑 플레이어</span>
      </div>
    </div>

    <!-- 3. 경기 상태 배너 -->
    <div id="statusBanner" class="shrink-0 w-full py-1.5 px-3 rounded-xl text-center font-extrabold text-xs sm:text-sm bg-slate-100 text-slate-600 border border-slate-200 transition-all truncate">
      방 번호를 입력해 경기에 연결하세요.
    </div>

    <!-- 4. 주사위 현황 (관전용 읽기 전공 표시) -->
    <div id="diceBar" class="shrink-0 flex items-center justify-center gap-2 sm:gap-3 bg-slate-50/90 border border-slate-200 rounded-2xl p-1.5 sm:p-2">
      <div id="die1" class="dice-box" aria-label="첫 번째 주사위"></div>
      <span class="text-base font-black text-slate-400 select-none">+</span>
      <div id="die2" class="dice-box" aria-label="두 번째 주사위"></div>
      <div class="flex flex-col ml-1">
        <span class="text-[10px] font-bold text-slate-500">주사위 눈의 합</span>
        <span id="diceSumText" class="text-sm sm:text-lg font-black text-slate-900 tracking-tight whitespace-nowrap">굴리기 전</span>
      </div>
    </div>

    <!-- 5. 육각별 보드판 (읽기 전용) -->
    <div class="flex-1 min-h-0 w-full flex items-center justify-center overflow-hidden py-0.5">
      <div class="wood-board relative h-full w-auto max-w-full max-h-full aspect-square rounded-3xl p-2.5 sm:p-4 select-none overflow-hidden">
        <div class="absolute top-3 left-3.5 text-[11px] sm:text-xs font-black text-amber-950/80 pointer-events-none whitespace-nowrap">
          ★ 한 줄(4칸)의 숫자 합 = 26
        </div>
        <div class="absolute top-3 right-3.5 text-[11px] sm:text-xs font-extrabold text-amber-950/80 pointer-events-none whitespace-nowrap">
          👀 관전 중 (조작 불가)
        </div>

        <svg id="boardSvg" viewBox="0 0 100 100" class="w-full h-full pointer-events-none">
          <g id="boardBingoLines"></g>
          <g id="boardPermanentBlackLines" stroke="#18181b" stroke-width="2.5" stroke-linecap="round">
            <line x1="16.0" y1="29.0" x2="84.0" y2="29.0" />
            <line x1="16.0" y1="71.0" x2="84.0" y2="71.0" />
            <line x1="50.0" y1="9.0"  x2="16.0" y2="71.0" />
            <line x1="50.0" y1="9.0"  x2="84.0" y2="71.0" />
            <line x1="16.0" y1="29.0" x2="50.0" y2="91.0" />
            <line x1="84.0" y1="29.0" x2="50.0" y2="91.0" />
          </g>
        </svg>
        <div id="lineHintsLayer" class="absolute inset-0 pointer-events-none"></div>
        <div id="nodesLayer" class="absolute inset-0"></div>
      </div>
    </div>

    <!-- 6. 최근 수 배너 -->
    <div id="lastMoveBanner" class="shrink-0 w-full text-[11px] sm:text-xs font-bold text-slate-500 truncate text-center">
      📢 관전 대기 중입니다.
    </div>
  </div>

  <script>
    // =========================================================================
    // 관전 전용 페이지: 선수 프로그램(온라인 1:1 모드)과 같은 MQTT 방 채널을
    // "구독 + 상태 요청(REQUEST_SYNC)"만으로 지켜봅니다.
    // PeerJS(WebRTC)에는 절대 접속하지 않으므로 선수 간 연결에 영향이 없습니다.
    // =========================================================================
    const MQTT_URL = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_BASE = 'gcds-p2p-2026/room_';
    const TURN_CLOCK_TOTAL = 300; // 선수 프로그램과 동일: 1인당 5분

    const NODES = [
      { pos: 0,  num: 10, x: 50.0, y: 9.0  },
      { pos: 1,  num: 12, x: 16.0, y: 29.0 },
      { pos: 2,  num: 1,  x: 38.5, y: 29.0 },
      { pos: 3,  num: 5,  x: 61.5, y: 29.0 },
      { pos: 4,  num: 8,  x: 84.0, y: 29.0 },
      { pos: 5,  num: 4,  x: 27.5, y: 50.0 },
      { pos: 6,  num: 9,  x: 72.5, y: 50.0 },
      { pos: 7,  num: 11, x: 16.0, y: 71.0 },
      { pos: 8,  num: 7,  x: 38.5, y: 71.0 },
      { pos: 9,  num: 6,  x: 61.5, y: 71.0 },
      { pos: 10, num: 2,  x: 84.0, y: 71.0 },
      { pos: 11, num: 3,  x: 50.0, y: 91.0 }
    ];
    const NUM_TO_POS = {};
    NODES.forEach(n => { NUM_TO_POS[n.num] = n.pos; });

    const LINES = [
      { id: 0, cells: [1, 2, 3, 4],  hintX: 89, hintY: 20, arrow: '←' },
      { id: 1, cells: [7, 8, 9, 10], hintX: 89, hintY: 83, arrow: '←' },
      { id: 2, cells: [0, 2, 5, 7],  hintX: 31, hintY: 7,  arrow: '↙' },
      { id: 3, cells: [0, 3, 6, 10], hintX: 69, hintY: 7,  arrow: '↘' },
      { id: 4, cells: [1, 5, 8, 11], hintX: 31, hintY: 94, arrow: '↖' },
      { id: 5, cells: [4, 6, 9, 11], hintX: 69, hintY: 94, arrow: '↗' }
    ];

    const DICE_PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };

    // ------------------------------------------------------------------
    // 관전 상태
    // ------------------------------------------------------------------
    const specClientId = 'spec-' + Math.random().toString(36).slice(2, 10);
    let mqttClient = null;
    let specRoom = null;
    let lastEventTime = 0;   // 마지막 실시간 경기 이벤트 수신 시각 (스냅샷 판별용)
    let animClearTimer = null;
    const seenPktIds = new Set(); // 중복 패킷 폐기용

    let state = {
      status: 'IDLE',               // 'IDLE' | 'RPS' | 'PLAYING' | 'FINISHED'
      turnOwner: 'red',
      phase: 'ROLL',
      dice: [null, null],
      board: Array(12).fill(null),
      winner: null,
      winReason: null,
      clockRed: TURN_CLOCK_TOTAL,
      clockBlue: TURN_CLOCK_TOTAL,
      lastMove: '',
      redName: '빨강 플레이어',
      blueName: '파랑 플레이어'
    };
    let newlyPlacedPos = new Set();
    let flippedPos = new Set();

    // ------------------------------------------------------------------
    // DOM
    // ------------------------------------------------------------------
    const inpSpecCode = document.getElementById('inpSpecCode');
    const btnJoinSpec = document.getElementById('btnJoinSpec');
    const btnLeaveSpec = document.getElementById('btnLeaveSpec');
    const joinBar = document.getElementById('joinBar');
    const connStatusPill = document.getElementById('connStatusPill');
    const specRoomBadge = document.getElementById('specRoomBadge');
    const badgeRed = document.getElementById('badgeRed');
    const badgeBlue = document.getElementById('badgeBlue');
    const labelRed = document.getElementById('labelRed');
    const labelBlue = document.getElementById('labelBlue');
    const countRedChips = document.getElementById('countRedChips');
    const countBlueChips = document.getElementById('countBlueChips');
    const clockRedEl = document.getElementById('clockRed');
    const clockBlueEl = document.getElementById('clockBlue');
    const statusBanner = document.getElementById('statusBanner');
    const die1El = document.getElementById('die1');
    const die2El = document.getElementById('die2');
    const diceSumText = document.getElementById('diceSumText');
    const lastMoveBanner = document.getElementById('lastMoveBanner');

    function renderDieFace(el, val) {
      el.innerHTML = '';
      if (!val) {
        for (let i = 1; i <= 9; i++) {
          const sp = document.createElement('span');
          if (i === 5) { sp.className = 'text-lg font-black text-slate-300'; sp.textContent = '?'; }
          el.appendChild(sp);
        }
        return;
      }
      const pips = DICE_PIPS[val] || [];
      for (let i = 1; i <= 9; i++) {
        const d = document.createElement('div');
        if (pips.includes(i)) d.className = val === 1 ? 'dice-pip dice-pip-one' : 'dice-pip';
        el.appendChild(d);
      }
    }

    function formatClock(sec) {
      const s = Math.max(0, Math.ceil(sec));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function setConnStatus(mode, text) {
      connStatusPill.textContent = text;
      connStatusPill.className = `text-[11px] font-extrabold px-2.5 py-0.5 rounded-full whitespace-nowrap border ${
        mode === 'on'
          ? 'bg-emerald-50 text-emerald-700 border-emerald-300'
          : mode === 'off'
          ? 'bg-rose-50 text-rose-700 border-rose-300'
          : 'bg-slate-100 text-slate-500 border-slate-300'
      }`;
    }

    function sendSpecPacket(type, extra = {}) {
      if (!mqttClient || !mqttClient.connected || !specRoom) return;
      const msg = {
        ...extra,
        type,
        roomCode: String(specRoom),
        senderId: specClientId,
        ts: Date.now()
      };
      try { mqttClient.publish(TOPIC_BASE + specRoom, JSON.stringify(msg), { qos: 1 }); } catch (e) {}
    }
    // ------------------------------------------------------------------
    // 관전 입장 / 퇴장
    // ------------------------------------------------------------------
    function joinSpectate() {
      const code = (inpSpecCode.value || '').trim();
      if (!/^\d{4}$/.test(code)) {
        inpSpecCode.classList.add('input-error-shake');
        setTimeout(() => inpSpecCode.classList.remove('input-error-shake'), 450);
        statusBanner.textContent = '⚠️ 4자리 숫자 방 번호를 정확히 입력해 주세요!';
        return;
      }

      if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }

      specRoom = code;
      setConnStatus('wait', '🟡 연결 시도 중...');

      if (typeof mqtt === 'undefined') {
        setConnStatus('off', '🔴 통신 라이브러리 로드 실패');
        return;
      }

      mqttClient = mqtt.connect(MQTT_URL, {
        keepalive: 30,
        clean: true,
        connectTimeout: 3500,
        reconnectPeriod: 1500
      });

      mqttClient.on('connect', () => {
        setConnStatus('on', `🟢 관전 연결됨`);
        specRoomBadge.textContent = `방 번호: ${specRoom}`;
        specRoomBadge.classList.remove('hidden');
        btnLeaveSpec.classList.remove('hidden');
        joinBar.classList.add('hidden');
        try { mqttClient.subscribe(TOPIC_BASE + specRoom, { qos: 1 }); } catch (e) {}
        // 입장 직후 현재 경기 상태를 선수에게 요청
        sendSpecPacket('REQUEST_SYNC');
      });
      mqttClient.on('reconnect', () => setConnStatus('wait', '🟡 재연결 시도 중...'));
      mqttClient.on('close', () => setConnStatus('wait', '🟡 연결 끊김 · 재연결 중...'));
      mqttClient.on('error', () => setConnStatus('off', '🔴 연결 오류'));

      mqttClient.on('message', (topic, buf) => {
        try { handleIncomingPacket(JSON.parse(buf.toString())); } catch (e) {}
      });

      render();
    }

    function leaveSpectate() {
      if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
      specRoom = null;
      lastEventTime = 0;
      seenPktIds.clear();
      state = {
        status: 'IDLE',
        turnOwner: 'red',
        phase: 'ROLL',
        dice: [null, null],
        board: Array(12).fill(null),
        winner: null,
        winReason: null,
        clockRed: TURN_CLOCK_TOTAL,
        clockBlue: TURN_CLOCK_TOTAL,
        lastMove: '',
        redName: '빨강 플레이어',
        blueName: '파랑 플레이어'
      };
      newlyPlacedPos.clear();
      flippedPos.clear();
      setConnStatus('idle', '⚪ 연결 대기 중');
      specRoomBadge.classList.add('hidden');
      btnLeaveSpec.classList.add('hidden');
      joinBar.classList.remove('hidden');
      inpSpecCode.value = '';
      inpSpecCode.focus();
      render();
    }

    // ------------------------------------------------------------------
    // 선수 프로그램 패킷 수신 처리
    // ------------------------------------------------------------------
    function handleIncomingPacket(msg) {
      if (!msg || String(msg.roomCode) !== String(specRoom)) return;
      if (msg.senderId === specClientId) return;
      if (msg.senderId && String(msg.senderId).startsWith('spec-')) return; // 다른 관전자 패킷 무시

      // 중복 패킷 폐기 (동일 메시지가 여러 경로로 중복 전달되는 것을 방지)
      if (msg.pktId) {
        if (seenPktIds.has(msg.pktId)) return;
        seenPktIds.add(msg.pktId);
        if (seenPktIds.size > 500) {
          const it = seenPktIds.values();
          for (let i = 0; i < 250; i++) seenPktIds.delete(it.next().value);
        }
      }

      // 너무 오래된(12초 이상 경과한) 패킷은 폐기 — 옛 세션의 잔여 메시지 재생 방지
      if (msg.ts && Date.now() - msg.ts > 12000) return;

      // 관전자의 REQUEST_SYNC에는 응답하지 않음 (선수만 응답)

      // 1) 실시간 경기 이벤트 기록
      const EVENT_TYPES = ['NEW_GAME', 'ROLL_DICE', 'PLACE_COMBO', 'PASS_TURN', 'TIME_OUT'];
      if (EVENT_TYPES.includes(msg.type)) lastEventTime = Date.now();

      // 2) 플레이어 이름 갱신 (모든 패킷에 포함되어 옴)
      if (msg.redName) state.redName = msg.redName;
      if (msg.blueName) state.blueName = msg.blueName;

      // 3) 남은 시간 동기화 (경기 진행 중일 때만)
      if (state.status === 'PLAYING' &&
          typeof msg.clockRed === 'number' && typeof msg.clockBlue === 'number') {
        state.clockRed = msg.clockRed;
        state.clockBlue = msg.clockBlue;
      }

      switch (msg.type) {
        case 'NEW_GAME': {
          state.status = 'PLAYING';
          state.turnOwner = msg.firstColor === 'blue' ? 'blue' : 'red';
          state.phase = 'ROLL';
          state.dice = [null, null];
          state.board = Array(12).fill(null);
          state.winner = null;
          state.winReason = null;
          state.clockRed = TURN_CLOCK_TOTAL;
          state.clockBlue = TURN_CLOCK_TOTAL;
          state.lastMove = '새 게임이 시작되었습니다!';
          newlyPlacedPos.clear();
          flippedPos.clear();
          break;
        }

        case 'ROLL_DICE': {
          if (state.status !== 'PLAYING') break;
          state.dice = [msg.d1, msg.d2];
          state.phase = 'PLACE';
          break;
        }

        case 'PLACE_COMBO': {
          if (state.status !== 'PLAYING' || !Array.isArray(msg.combo)) break;
          const actor = state.turnOwner;
          newlyPlacedPos.clear();
          flippedPos.clear();
          msg.combo.forEach(num => {
            const pos = NUM_TO_POS[num];
            if (pos == null) return;
            const prev = state.board[pos];
            if (prev && prev !== actor) flippedPos.add(pos);
            else if (!prev) newlyPlacedPos.add(pos);
            state.board[pos] = actor;
          });

          const wins = getWinningLines();
          const actorWins = wins.some(w => w.color === actor);
          state.phase = 'ROLL';
          state.dice = [null, null];
          if (actorWins) {
            state.status = 'FINISHED';
            state.winner = actor;
            state.winReason = 'bingo';
          } else {
            state.turnOwner = actor === 'red' ? 'blue' : 'red';
          }
          state.lastMove = `${actor === 'red' ? '🔴' : '🔵'} [${msg.combo.join(' + ')}] 배치 완료${
            flippedPos.size > 0 ? ` (상대 칩 ${flippedPos.size}개 뒤집기!)` : ''
          }`;
          if (animClearTimer) clearTimeout(animClearTimer);
          animClearTimer = setTimeout(() => {
            newlyPlacedPos.clear();
            flippedPos.clear();
            renderBoard();
          }, 700);
          break;
        }

        case 'PASS_TURN': {
          if (state.status !== 'PLAYING') break;
          state.turnOwner = state.turnOwner === 'red' ? 'blue' : 'red';
          state.phase = 'ROLL';
          state.dice = [null, null];
          state.lastMove = `${state.turnOwner === 'red' ? '🔵' : '🔴'} 놓을 수 있는 조합이 없어 턴을 넘겼습니다.`;
          break;
        }

        case 'TIME_OUT': {
          const loser = msg.loser === 'blue' ? 'blue' : 'red';
          state.status = 'FINISHED';
          state.winner = loser === 'red' ? 'blue' : 'red';
          state.winReason = 'timeout';
          state.phase = 'ROLL';
          state.dice = [null, null];
          state.lastMove = `⏰ ${loser === 'red' ? '🔴' : '🔵'}의 시간이 모두 소진되어 자동 패배!`;
          break;
        }

        case 'STATE_SNAPSHOT': {
          // 최근 2.5초 내에 실시간 이벤트를 받았다면 (애니메이션 중 스냅샷일 수 있으므로) 무시
          if (Date.now() - lastEventTime < 2500) break;
          state.turnOwner = msg.turnOwner === 'blue' ? 'blue' : 'red';
          state.phase = msg.phase === 'PLACE' ? 'PLACE' : 'ROLL';
          state.dice = Array.isArray(msg.dice) && msg.dice.length === 2 ? msg.dice : [null, null];
          if (Array.isArray(msg.board) && msg.board.length === 12) state.board = msg.board.slice();
          state.status = ['RPS', 'PLAYING', 'FINISHED'].includes(msg.status) ? msg.status : state.status;
          state.winner = msg.winner || null;
          state.winReason = msg.winReason || null;
          if (typeof msg.clockRed === 'number') state.clockRed = msg.clockRed;
          if (typeof msg.clockBlue === 'number') state.clockBlue = msg.clockBlue;
          break;
        }

        case 'OPEN_RPS':
        case 'RPS_PICK':
        case 'GUEST_JOIN':
        case 'HOST_WELCOME': {
          if (state.status !== 'FINISHED') state.status = 'RPS';
          break;
        }
      }

      render();
    }

    function getWinningLines() {
      const wins = [];
      LINES.forEach((line, idx) => {
        const first = state.board[line.cells[0]];
        if (first && line.cells.every(pos => state.board[pos] === first)) {
          wins.push({ idx, color: first });
        }
      });
      return wins;
    }
    // ------------------------------------------------------------------
    // 15초마다 상태 동기화 요청 (드리프트 자동 보정)
    // ------------------------------------------------------------------
    setInterval(() => {
      if (mqttClient && mqttClient.connected && specRoom && state.status !== 'IDLE') {
        sendSpecPacket('REQUEST_SYNC');
      }
    }, 15000);

    // ------------------------------------------------------------------
    // 관전용 시계 표시 (차감은 선수 패킷 기준, 0.25초 로컬 보간)
    // ------------------------------------------------------------------
    setInterval(() => {
      if (state.status !== 'PLAYING') return;
      const key = state.turnOwner === 'red' ? 'clockRed' : 'clockBlue';
      state[key] = Math.max(0, state[key] - 0.25);
      renderClocks();
    }, 250);

    function renderClocks() {
      const paint = (el, v) => {
        el.textContent = `⏱ ${formatClock(v)}`;
        el.className = `px-2 py-0.5 rounded-full font-black text-xs tabular-nums ${
          v <= 30 ? 'bg-amber-300 text-amber-950 animate-pulse' : 'bg-slate-100 text-slate-800'
        }`;
      };
      paint(clockRedEl, state.clockRed);
      paint(clockBlueEl, state.clockBlue);
    }

    // ------------------------------------------------------------------
    // 화면 렌더링 (읽기 전용)
    // ------------------------------------------------------------------
    function render() {
      // 점수판
      labelRed.textContent = `🔴 ${state.redName}`;
      labelBlue.textContent = `🔵 ${state.blueName}`;
      const redCnt = state.board.filter(c => c === 'red').length;
      const blueCnt = state.board.filter(c => c === 'blue').length;
      countRedChips.textContent = `${redCnt}개`;
      countBlueChips.textContent = `${blueCnt}개`;

      const redTurn = state.status === 'PLAYING' && state.turnOwner === 'red';
      const blueTurn = state.status === 'PLAYING' && state.turnOwner === 'blue';
      badgeRed.className = `flex items-center gap-1.5 px-3 py-1 rounded-xl border-2 font-bold text-xs sm:text-sm transition whitespace-nowrap ${
        redTurn ? 'bg-slate-900 border-slate-900 text-white shadow-xs' : 'bg-white border-slate-200 text-slate-500'
      }`;
      badgeBlue.className = `flex items-center gap-1.5 px-3 py-1 rounded-xl border-2 font-bold text-xs sm:text-sm transition whitespace-nowrap ${
        blueTurn ? 'bg-slate-900 border-slate-900 text-white shadow-xs' : 'bg-white border-slate-200 text-slate-500'
      }`;

      renderClocks();

      // 주사위
      renderDieFace(die1El, state.dice[0]);
      renderDieFace(die2El, state.dice[1]);
      const sum = state.dice[0] && state.dice[1] ? state.dice[0] + state.dice[1] : null;
      diceSumText.textContent = sum ? `${sum} (${state.dice[0]} + ${state.dice[1]})` : '굴리기 전';

      // 상태 배너
      const colorLabel = state.turnOwner === 'red' ? state.redName : state.blueName;
      const colorIcon = state.turnOwner === 'red' ? '🔴' : '🔵';
      if (state.status === 'IDLE') {
        statusBanner.className = 'shrink-0 w-full py-1.5 px-3 rounded-xl text-center font-extrabold text-xs sm:text-sm bg-slate-100 text-slate-600 border border-slate-200 truncate';
        statusBanner.textContent = '연결 대기 중... 선수 화면의 4자리 방 번호를 입력하세요.';
      } else if (state.status === 'RPS') {
        statusBanner.className = 'shrink-0 w-full py-1.5 px-3 rounded-xl text-center font-extrabold text-xs sm:text-sm bg-amber-50 text-amber-900 border border-amber-200 truncate';
        statusBanner.textContent = '✌️✊🖐️ 참가자들이 가위바위보로 선공을 정하는 중입니다...';
      } else if (state.status === 'FINISHED') {
        const winLabel = state.winner === 'red' ? state.redName : state.blueName;
        statusBanner.className = 'w-full py-3 px-4 rounded-2xl text-center font-black text-sm sm:text-base bg-indigo-600 text-white shadow-md';
        statusBanner.textContent = state.winReason === 'timeout'
          ? `⏰ 시간 초과! ${winLabel} 님 승리! (상대의 남은 시간이 모두 소진됨)`
          : `🎉 빙고 완성! ${winLabel} 님이 합 26 한 줄(4칸)을 완성해 승리했습니다!`;
      } else if (state.phase === 'ROLL') {
        statusBanner.className = 'shrink-0 w-full py-1.5 px-3 rounded-xl text-center font-extrabold text-xs sm:text-sm bg-slate-100 text-slate-700 border border-slate-200 truncate';
        statusBanner.textContent = `🎲 ${colorIcon} ${colorLabel} 님이 주사위를 굴리는 중...`;
      } else {
        statusBanner.className = 'shrink-0 w-full py-1.5 px-3 rounded-xl text-center font-extrabold text-xs sm:text-sm bg-indigo-50 text-indigo-950 border border-indigo-200 truncate';
        statusBanner.textContent = `🎯 ${colorIcon} ${colorLabel} 님이 주사위 합 [${sum}]의 숫자를 고르고 있습니다...`;
      }

      lastMoveBanner.textContent = state.lastMove ? `📢 ${state.lastMove}` : '📢 관전 대기 중입니다.';

      renderBoard();
    }

    function renderBoard() {
      const wins = getWinningLines();
      const winLineIds = new Set(wins.map(w => w.idx));
      const winningPositions = new Set();
      wins.forEach(w => LINES[w.idx].cells.forEach(c => winningPositions.add(c)));

      // 빙고 라인 골드 하이라이트
      const bingoGroup = document.getElementById('boardBingoLines');
      if (bingoGroup) {
        let bingoSvg = '';
        LINES.forEach((line, idx) => {
          if (winLineIds.has(idx)) {
            const nStart = NODES[line.cells[0]];
            const nEnd = NODES[line.cells[3]];
            bingoSvg += `<line x1="${nStart.x}" y1="${nStart.y}" x2="${nEnd.x}" y2="${nEnd.y}" stroke="#facc15" stroke-width="6.5" stroke-linecap="round" opacity="0.85" />`;
          }
        });
        bingoGroup.innerHTML = bingoSvg;
      }

      // 줄별 현황 배지
      const lineHintsLayer = document.getElementById('lineHintsLayer');
      lineHintsLayer.innerHTML = '';
      LINES.forEach(line => {
        const rCnt = line.cells.filter(p => state.board[p] === 'red').length;
        const bCnt = line.cells.filter(p => state.board[p] === 'blue').length;
        const isBingo = rCnt === 4 || bCnt === 4;
        const isThreat = !isBingo && (rCnt === 3 || bCnt === 3);

        const badge = document.createElement('div');
        badge.style.left = `${line.hintX}%`;
        badge.style.top = `${line.hintY}%`;

        let colorCls = 'bg-stone-800/90 text-amber-50 border-stone-600';
        if (isBingo) colorCls = 'bg-amber-400 text-slate-950 border-amber-700 scale-110 shadow-md';
        else if (isThreat) colorCls = 'bg-indigo-950/95 text-amber-300 border-amber-400';

        badge.className = `line-badge absolute border text-[10px] sm:text-xs font-black ${colorCls}`;
        badge.textContent = isBingo ? '⭐ 26 빙고!' : `${line.arrow} 🔴 ${rCnt} · 🔵 ${bCnt}`;
        lineHintsLayer.appendChild(badge);
      });

      // 12개 숫자 칸 (읽기 전용)
      const nodesLayer = document.getElementById('nodesLayer');
      nodesLayer.innerHTML = '';
      NODES.forEach(node => {
        const owner = state.board[node.pos];
        const isNewDrop = newlyPlacedPos.has(node.pos);
        const isFlipped = flippedPos.has(node.pos);
        const isWinCell = winningPositions.has(node.pos);
        const ul = node.num === 6 || node.num === 9 ? 'num-underline' : '';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.left = `${node.x}%`;
        btn.style.top = `${node.y}%`;

        if (!owner) {
          btn.className = 'board-slot-printed absolute -translate-x-1/2 -translate-y-1/2 w-[12.2%] h-[12.2%] rounded-full flex items-center justify-center cursor-default';
          btn.innerHTML = `<span class="text-base sm:text-2xl font-black text-stone-800 ${ul}">${node.num}</span>`;
        } else {
          const isRed = owner === 'red';
          const animClass = isWinCell
            ? 'bingo-chip-celebrate'
            : isFlipped
            ? 'chip-flip-3d'
            : isNewDrop
            ? 'chip-place-drop'
            : '';

          btn.className = `yellow-chip absolute -translate-x-1/2 -translate-y-1/2 w-[12.8%] h-[12.8%] rounded-full flex flex-col items-center justify-center ${animClass}`;

          const rippleHtml = (isNewDrop || isFlipped)
            ? `<span class="slot-ripple-ring ${isFlipped ? 'slot-ripple-flip' : ''}"></span>`
            : '';

          btn.innerHTML = `
            ${rippleHtml}
            <span class="text-base sm:text-2xl font-black leading-none ${isRed ? 'text-red-600' : 'text-blue-600'} ${ul}">${node.num}</span>
            <span class="absolute -bottom-1.5 px-1.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-black leading-none shadow-2xs ${isRed ? 'bg-red-600 text-white' : 'bg-blue-600 text-white'}">${isRed ? '빨강' : '파랑'}</span>
          `;
        }

        nodesLayer.appendChild(btn);
      });
    }

    // ------------------------------------------------------------------
    // 이벤트 연결 & 시작
    // ------------------------------------------------------------------
    btnJoinSpec.addEventListener('click', joinSpectate);
    btnLeaveSpec.addEventListener('click', leaveSpectate);
    inpSpecCode.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinSpectate();
    });
    inpSpecCode.addEventListener('input', () => {
      inpSpecCode.value = inpSpecCode.value.replace(/\D/g, '').slice(0, 4);
    });

    renderDieFace(die1El, null);
    renderDieFace(die2El, null);
    inpSpecCode.focus();


  </script>
</body>
